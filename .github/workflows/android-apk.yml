name: android-apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Name artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk NEXCODE-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEXCODE-Android.apk
          path: NEXCODE-Android.apk
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NEXCODE-Android.apk --clobber
          else
            gh release create "$TAG" NEXCODE-Android.apk --title "NEXCODE Android APK" --notes "Sideload APK: official WebView of the live PWA (camera/mic allowed). Early Access, debug-signed. Not a Play Store listing."
          fi
